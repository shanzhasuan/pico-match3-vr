app:
  id: "7702537656537792548"
  name: "空间消消乐"
  slogan: "在天空动物棋盘上触发连锁消除，挑战五种目标和25个关卡。"
  description: |-
    空间消消乐是一款在 PICO 头显中体验的动物主题三消游戏。棋盘悬浮在天空与藤蔓背景前，小动物以立体模型呈现。通过选择两个相邻动物进行交换，连接三个及以上相同动物来消除。每一次匹配都能看到消除效果、补位与连锁，关卡目标和剩余步数随游玩进展更新。

    游戏包含25个关卡，分为分数、冰块、金豆荚、宝石和蜗牛五类挑战。不同关卡有不同的目标和步数限制，需要寻找有效匹配并安排特殊消除的触发时机。四连条纹、L/T炸弹和五连魔力鸟带来更多组合机会，特殊效果还能继续触发连锁。

    每局配有3个锤子，并提供提示与重试按钮。选关界面可以在已解锁的章节和关卡之间切换，完成挑战后逐步解锁更多内容。适合短时间休闲游玩，也适合反复尝试不同的匹配与连锁策略。
  tags:
    - "三消"
    - "益智"
    - "休闲"
  category: "game"
  icon: "assets/icon.jpg"
  landscape: "assets/landscape.png"
  detail_images:
    - "assets/detail-1.png"
    - "assets/detail-2.png"
    - "assets/detail-3.png"
    - "assets/detail-4.png"
    - "assets/detail-5.png"
  videos: []
version:
  name: "V1.0.0"
  notes: "首个版本包含五类目标、25个关卡；提供悬浮动物棋盘、天空藤蔓背景及启动过渡动画；保留四连条纹、L/T炸弹、五连魔力鸟和连锁消除；每局提供3个锤子，并支持提示、重试和已解锁关卡选择。本次同步所选应用图标、横版封面和五类关卡运行截图。"
